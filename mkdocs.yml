# The pages come from the repositories of the components: assemble.py puts
# them into build/docs by the nav below and projects.yml, then mkdocs builds.
site_name: Anton Petrusevich
site_url: https://jef-sure.github.io/
docs_dir: build/docs
site_dir: build/site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light

plugins:
  - search:
      lang: [en, ru]

markdown_extensions:
  - toc:
      permalink: true
      # the anchors GitHub makes, Cyrillic included, so that the links of the
      # repositories land on the same headings here
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.tilde
  - pymdownx.tasklist

# with --strict each of these stops the build
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

